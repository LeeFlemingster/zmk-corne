# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Soft off
CONFIG_ZMK_PM_SOFT_OFF=y

# Completely disable RGB underglow / backlighting
CONFIG_ZMK_RGB_UNDERGLOW=y
ONFIG_WS2812_STRIP=y
# Some wired Corne PCBs route the LED power directly to the VCC line. If your
# LEDs remain dimly lit or continue draining battery even with
# CONFIG_ZMK_RGB_UNDERGLOW=n, you may have to physically desolder the VCC pin
# going to the first LED to fully break the circuit.
#
# When you set CONFIG_ZMK_RGB_UNDERGLOW=n, ZMK successfully disables the RGB
# lighting software controls. However, it also completely disables the
# automatic connection between the RGB underglow state and the physical
# hardware power. On a genuine nice!nano, the VCC pin (External Power) defaults
# to ON at startup. Because the RGB software is turned off, ZMK never sends the
# command to pull that pin low. As a result, the physical line supplying power
# to your Corne's WS2812B LEDs remains active.

# Turn off external power when not needed (cuts power to the LED data line)
CONFIG_ZMK_EXT_POWER=y

# Enable deep sleep support
CONFIG_ZMK_SLEEP=y

# Milliseconds of inactivity before entering idle state (30 seconds)
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Milliseconds of inactivity before entering deep sleep (15 minutes)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y
# Disable OLED displays to conserve battery
CONFIG_ZMK_DISPLAY=n
# If your wired Corne has standard SSD1306 OLED displays, they consume an
# immense amount of battery power. If you aren't replacing them with
# ultra-low-power Sharp Memory Displays (like the nice!view), it is highly
# recommended to turn them off completely


